[project]
name = "eris-validation"
description = "Scores eris's IS–CDS relations (side, distance, effect) against a curated truth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mappy>=2.28", "biopython>=1.84", "pandas>=2.2"]

[project.scripts]
erisval = "eris_validation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "snakemake>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eris_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs data/ and runs eris"]
